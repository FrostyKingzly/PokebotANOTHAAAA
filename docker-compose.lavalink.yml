services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: pokebot-lavalink
    restart: unless-stopped
    ports:
      - "2333:2333"
    volumes:
      - ./docker/lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./docker/lavalink/logs:/opt/Lavalink/logs
